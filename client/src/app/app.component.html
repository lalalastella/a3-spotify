<nav class="navbar app-navbar sticky-top" aria-label="Primary navigation">
  <a class="navbar-brand app-brand" href="/" aria-label="TuneCrate — INF133 Spotify Browser home">
    <span class="brand-signal" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-copy">
      <strong>TuneCrate</strong>
      <small>INF133 Spotify Browser</small>
    </span>
  </a>
  <div class="nav-actions">
    <a class="favorites-nav" routerLink="/favorites">Favorites</a>
    @if(authState.connected$ | async) {
      <div class="account-controls">
        @if(authState.profile$ | async; as profile) {
          <img class="nav-avatar" [src]="profile.imageURL" [alt]="profile.name + ' profile picture'">
        } @else {
          <img class="nav-avatar is-placeholder" src="assets/default-profile.svg" alt="">
        }
        <a class="logout-link" href="http://127.0.0.1:8888/logout" (click)="authState.clear()">
          <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-3M10 12h11m-3-3 3 3-3 3" />
          </svg>
          <span class="logout-label">Log out</span>
        </a>
      </div>
    } @else {
      <a class="btn btn-light login-button" href="http://127.0.0.1:8888/login">Log in</a>
    }
  </div>
</nav>
<main class="container-fluid app-shell">
  <router-outlet></router-outlet>
</main>
