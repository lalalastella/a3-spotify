@if(tracks) {
	<div class="track-table-wrap">
	<table class="table table-sm table-light table-striped">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Track</th>
				<th scope="col">Duration</th>
				@if(!hideArtist) { <th scope="col">Primary Artist</th> }
				@if(!hideAlbum) { <th scope="col">Album</th> }
			</tr>
		</thead>
		<tbody>
			@for(track of tracks; track track.id; let index=$index) {
			<tr>
				<td data-label="#">{{ index + 1 }}</td>
				<td data-label="Track">
					<a [routerLink]="['/track', track.id]">{{ track.name }}</a>
				</td>
				<td data-label="Duration">{{ track.durationStr }}</td>
				@if(!hideArtist) {
					<td data-label="Primary artist"><a [routerLink]="['/artist', track.artists[0].id]">{{ track.artists[0].name }}</a></td>
				}
				@if(!hideAlbum) {
					<td data-label="Album"><a [routerLink]="['/album', track.album.id]">{{ track.album.name }}</a></td>
				}
			</tr>
			}
		</tbody>
	</table>
	</div>
}
