<section class="popularity-meter" [style.--meter-color]="popularity.color" [attr.aria-label]="label + ': ' + popularity.percentageString">
  <div class="meter-heading">
    <div>
      <p class="meter-label">{{ label }}</p>
      <p class="meter-status">{{ popularityLabel }} audience signal</p>
    </div>
    <p class="meter-score">
      <strong>{{ popularity.percentageString }}</strong>
      <span>of 100</span>
    </p>
  </div>

  <div class="meter-track">
    <div
      class="meter-fill"
      role="progressbar"
      [style.width]="popularity.percentageString"
      [attr.aria-label]="label"
      [attr.aria-valuenow]="popularity.percent * 100"
      aria-valuemin="0"
      aria-valuemax="100">
      <span class="meter-marker" aria-hidden="true"></span>
    </div>
  </div>

  <div class="meter-scale" aria-hidden="true">
    <span>0</span>
    <span>50</span>
    <span>100</span>
  </div>
</section>
