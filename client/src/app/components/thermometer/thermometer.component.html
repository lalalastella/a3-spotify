<section class="popularity-meter" [style.--meter-color]="popularity.color" [attr.aria-label]="label + ': ' + popularity.percentageString">
  <div class="meter-heading">
    <p class="meter-label">{{ label }}</p>
    <p class="meter-score">{{ displayedPercentageString }}</p>
  </div>

  <div class="meter-track">
    <div
      class="meter-fill"
      role="progressbar"
      [style.width.%]="displayedPercent"
      [attr.aria-label]="label"
      [attr.aria-valuenow]="displayedPercent"
      aria-valuemin="0"
      aria-valuemax="100">
    </div>
  </div>

  <div class="meter-scale" aria-hidden="true">
    <span>0</span>
    <span>100</span>
  </div>
</section>
