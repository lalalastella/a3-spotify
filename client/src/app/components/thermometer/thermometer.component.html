<div class="progress">
  <div class="progress-bar" role="progressbar" [style.background-color]="popularity.color" [style.width]="popularity.percentageString" [attr.aria-valuenow]="popularity.percent * 100" aria-valuemin="0" aria-valuemax="100">
	<span class="progress-bar-text">{{ label }}: {{ popularity.percentageString }}</span>
  </div>
</div>
