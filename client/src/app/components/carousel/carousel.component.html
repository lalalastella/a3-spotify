@if(resources) {
<div [id]="carouselId" class="carousel slide carousel-fade">
  <div class="carousel-inner">
    @for(resource of resources; track resource.id; let first=$first) {
      <app-carousel-card class="carousel-item" [class.active]="first" [resource]="resource"></app-carousel-card>
    }
  </div>
  <button type="button" class="carousel-control-prev" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="prev" aria-label="Previous result">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  </button>
  <button type="button" class="carousel-control-next" [attr.data-bs-target]="carouselIdForBinding" data-bs-slide="next" aria-label="Next result">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
  </button>
</div>
}
