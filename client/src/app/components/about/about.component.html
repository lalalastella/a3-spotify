<section class="panel profile-panel" aria-labelledby="profile-heading" [attr.aria-busy]="isLoading">
	<p class="eyebrow">Your listening identity</p>
	<h1 id="profile-heading">Spotify profile</h1>
	<img [src]="profile_pic" class="profile" [alt]="name ? name + ' Spotify profile picture' : 'Default profile picture'">
	<h3>Logged in user: {{ name || 'Unknown' }}</h3>
	@if(errorMessage) { <p class="profile-error" role="alert">{{ errorMessage }}</p> }
	<div class="profile-actions">
		<button class="btn btn-light" (click)="loadProfile()" [disabled]="isLoading">
			@if(isLoading) { Loading profile… } @else if(name) { Reload profile } @else { Load info about me }
		</button>
		@if(profile_link) {
			<a class="profile-link" [href]="profile_link" target="_blank" rel="noopener noreferrer">Open profile on Spotify <span aria-hidden="true">↗</span></a>
		}
	</div>
</section>
